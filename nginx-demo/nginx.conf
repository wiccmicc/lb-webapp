# Демонстрационный L7-балансировщик (round-robin) для локальной проверки.
# Полноценная настройка Apache/Nginx выполняется в ЛР №3.
events {}

http {
  upstream backend {
    server app1:3000;
    server app2:3000;
    server app3:3000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # для SSE / долгих запросов
      proxy_buffering off;
      proxy_read_timeout 60s;
    }
  }
}
